<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de Reels · Sundesign</title>
<link rel="icon" href="/web/icon-192.png">
<style>
@font-face { font-family: "Anton"; src: url("/web/fonts/Anton-Regular.ttf"); }
@font-face { font-family: "Oswald"; src: url("/web/fonts/Oswald-Variable.ttf"); font-weight: 200 700; }
:root {
  --ink: #1E1E1C; --ink-2: #4a4a46; --ink-3: #8a8a84;
  --bg: #F6F4EF; --card: #FFFFFF; --line: #E6E2D8;
  --yellow: #F9D20A; --yellow-soft: #FFF6C4; --green: #2E8B57; --green-soft: #E3F3EA;
  --red: #C0392B; --red-soft: #FBE7E4; --gray-soft: #EEECE6;
  --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
/* barra lateral */
.side { background: var(--ink); color: #fff; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.brand img { width: 46px; height: 46px; border-radius: 50%; background: #fff; }
.brand b { font-family: "Anton"; font-size: 20px; letter-spacing: .5px; display: block; line-height: 1.05; }
.brand small { color: #bdbdb5; font-size: 12px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: #dcdcd4; font-family: "Oswald"; font-size: 16px; letter-spacing: .3px; }
.nav a:hover { background: #2c2c29; color: #fff; }
.nav a.on { background: var(--yellow); color: var(--ink); }
.nav .count { margin-left: auto; background: var(--yellow); color: var(--ink); border-radius: 20px; font-size: 12px; padding: 1px 8px; font-family: "Segoe UI", sans-serif; font-weight: 700; }
.nav a.on .count { background: var(--ink); color: var(--yellow); }
.side .foot { margin-top: auto; font-size: 12px; color: #9a9a92; line-height: 1.5; word-break: break-all; }
/* principal */
main { padding: 28px 36px 60px; max-width: 1240px; width: 100%; }
h1 { font-family: "Anton"; font-weight: 400; font-size: 34px; margin: 0; letter-spacing: .3px; }
h2 { font-family: "Oswald"; font-weight: 600; font-size: 20px; margin: 0 0 12px; }
h3 { font-family: "Oswald"; font-weight: 600; font-size: 16px; margin: 0 0 8px; }
.top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.top .sp { flex: 1; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-family: "Oswald"; font-size: 15px; letter-spacing: .3px; background: var(--gray-soft); color: var(--ink); display: inline-flex; gap: 8px; align-items: center; text-decoration: none; }
.btn:hover { filter: brightness(.96); }
.btn.pri { background: var(--yellow); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.ok { background: var(--green); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--red); border: 1px solid #ecc8c2; }
.btn.big { padding: 13px 22px; font-size: 17px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 20px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chip.operador { background: var(--yellow-soft); color: #6b5a00; }
.chip.claude { background: var(--gray-soft); color: var(--ink-2); }
.chip.nadie { background: var(--green-soft); color: var(--green); }
.chip.claude::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
/* aviso "le toca a Claude" + ventana de 3 pasos */
.claudebar { background: var(--ink); color: #fff; border-radius: var(--radius); padding: 16px 20px; display: flex; gap: 16px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
.claudebar .ic { font-size: 30px; }
.claudebar b { font-family: "Oswald"; font-size: 19px; color: var(--yellow); font-weight: 600; display: block; }
.claudebar span { color: #cfcfc6; font-size: 14px; }
.claudebar .btn { margin-left: auto; }
.btn.huge { padding: 16px 26px; font-size: 20px; border-radius: 12px; }
.modal { position: fixed; inset: 0; background: rgba(20,20,18,.6); display: grid; place-items: center; z-index: 60; padding: 20px; }
.modal .box { background: #fff; border-radius: 18px; max-width: 620px; width: 100%; padding: 28px 28px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal h2 { font-family: "Anton"; font-weight: 400; font-size: 30px; margin-bottom: 4px; }
.paso { display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.paso .num { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-family: "Anton"; font-size: 24px; background: var(--gray-soft); }
.paso.ok .num { background: var(--green); color: #fff; }
.paso > div > b { font-family: "Oswald"; font-size: 19px; font-weight: 600; display: block; }
.paso p { margin: 3px 0 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.45; }
kbd { display: inline-block; border: 1px solid #cfcabd; border-bottom-width: 3px; border-radius: 6px; padding: 1px 8px; font-family: "Segoe UI", sans-serif; font-size: 14px; background: #fbfaf7; font-weight: 600; }
.orange { display: inline-block; width: 18px; height: 18px; border-radius: 5px; background: #D97757; vertical-align: -3px; }
/* preproducción */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
.choice { border: 2px solid var(--line); border-radius: 14px; padding: 18px; background: #fff; }
.choice.main { border-color: var(--yellow); background: #fffdf2; }
.choice h3 { font-size: 19px; } .choice p { color: var(--ink-2); font-size: 14px; margin: 4px 0 12px; }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 10px; }
.idea { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: #fff; display: flex; flex-direction: column; gap: 8px; }
.idea.rec { border: 2px solid var(--yellow); }
.idea h3 { margin: 0; font-size: 18px; } .idea .k { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--ink-3); }
.idea .v { font-size: 14px; } .idea .btn { margin-top: auto; align-self: flex-start; }
.badge { display: inline-block; background: var(--yellow); border-radius: 20px; padding: 2px 9px; font-size: 12px; font-weight: 700; }
.badge.g { background: var(--gray-soft); font-weight: 600; }
.plan-frame { width: 100%; height: 720px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.shots { list-style: none; padding: 0; margin: 12px 0 0; }
.shots li { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.shots .num { width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--yellow); display: grid; place-items: center; font-family: "Anton"; font-size: 20px; }
.shots li.done .num { background: var(--green); color: #fff; }
.shots .d { font-size: 14px; } .shots .d b { font-family: "Oswald"; font-size: 16px; font-weight: 600; }
.shots .d i { color: var(--ink-2); }
/* productos */
.prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.prod { text-decoration: none; padding: 0; overflow: hidden; }
.prod .ph { height: 160px; background: var(--gray-soft) center/cover no-repeat; display: grid; place-items: center; font-size: 40px; }
.prod .bd { padding: 12px 14px; } .prod h3 { margin: 0 0 4px; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; }
.gal div { position: relative; aspect-ratio: 1; border-radius: 10px; background: var(--gray-soft) center/cover no-repeat; cursor: zoom-in; }
.gal button { position: absolute; top: 4px; right: 4px; border: 0; border-radius: 6px; background: rgba(255,255,255,.9); cursor: pointer; }
.feat { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #fbfaf7; }
.feat .fi { display: grid; gap: 6px; } .feat .fi input[data-fk=c] { font-weight: 700; }
.feat button { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 18px; }
.prodpick { background: var(--yellow-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
/* banner cowork */
.banner { background: var(--ink); color: #fff; border-radius: var(--radius); padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; margin-bottom: 22px; }
.banner b { font-family: "Oswald"; font-size: 18px; color: var(--yellow); font-weight: 600; }
.prompt { background: #2c2c29; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 8px; color: #e8e8e0; }
/* tarjetas de trabajos */
.tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.tabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; cursor: pointer; color: var(--ink-2); font-family: "Oswald"; font-size: 15px; }
.tabs button.on { background: var(--card); box-shadow: var(--shadow); color: var(--ink); }
.jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.job { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; display: flex; gap: 12px; padding: 12px; text-decoration: none; box-shadow: var(--shadow); transition: transform .12s; }
.job:hover { transform: translateY(-2px); }
.thumb { width: 66px; aspect-ratio: 9/16; border-radius: 8px; background: var(--gray-soft) center/cover no-repeat; flex: none; display: grid; place-items: center; color: var(--ink-3); font-size: 22px; }
.job .t { font-family: "Oswald"; font-weight: 600; font-size: 16px; line-height: 1.2; margin-bottom: 6px; }
.job .chip { white-space: normal; line-height: 1.3; }
.job .m { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.empty { text-align: center; padding: 48px 20px; color: var(--ink-3); }
.empty b { display: block; font-family: "Oswald"; font-size: 20px; color: var(--ink); margin-bottom: 6px; }
/* pasos */
.steps { display: flex; gap: 0; margin: 4px 0 22px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.steps div { flex: 1; padding: 10px 12px; font-family: "Oswald"; font-size: 14px; color: var(--ink-3); border-right: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.steps div:last-child { border-right: 0; }
.steps i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--gray-soft); font-size: 12px; }
.steps .done { color: var(--ink-2); } .steps .done i { background: var(--green); color: #fff; }
.steps .now { color: var(--ink); background: var(--yellow-soft); } .steps .now i { background: var(--yellow); }
/* acción actual */
.action { border: 2px solid var(--yellow); }
.action.wait { border-color: var(--line); }
.drop { border: 2px dashed #cfcabd; border-radius: 12px; padding: 22px; text-align: center; cursor: pointer; color: var(--ink-2); background: #fbfaf7; }
.drop.over { border-color: var(--ink); background: var(--yellow-soft); }
.drop b { font-family: "Oswald"; font-size: 17px; display: block; color: var(--ink); }
.files { list-style: none; padding: 0; margin: 12px 0 0; }
.files li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.files li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files button { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 18px; }
.files button:hover { color: var(--red); }
.bar { height: 6px; background: var(--gray-soft); border-radius: 4px; overflow: hidden; flex: 1; max-width: 160px; }
.bar i { display: block; height: 100%; background: var(--yellow); width: 0; transition: width .2s; }
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 5px; }
.field { margin-bottom: 14px; }
input[type=text], input[type=number], select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: #fff; }
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--yellow); border-color: transparent; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 20px; padding: 5px 11px; font-size: 13.5px; cursor: pointer; background: #fff; }
.checks label:has(input:checked) { background: var(--yellow-soft); border-color: #e9d36a; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.hint { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.player { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
.sb { max-width: 900px; }
video { width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 12px; }
.sb img { width: 100%; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
.vers { display: flex; gap: 6px; flex-wrap: wrap; }
.vers button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-family: "Oswald"; }
.vers button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.caption { white-space: pre-wrap; background: #fbfaf7; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; max-height: 260px; overflow: auto; }
.md { font-size: 14px; line-height: 1.55; }
.md h1, .md h2, .md h3 { font-family: "Oswald"; font-weight: 600; margin: 14px 0 6px; font-size: 17px; }
.md h1 { font-size: 20px; }
.md table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
.md td, .md th { border: 1px solid var(--line); padding: 5px 7px; text-align: left; vertical-align: top; }
.md code { background: var(--gray-soft); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.timeline { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.timeline li { padding: 8px 0 8px 16px; border-left: 2px solid var(--line); position: relative; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.timeline li.c::before { background: var(--ink); }
.timeline li.o::before { background: var(--yellow); }
.timeline .q { color: var(--ink-2); font-style: italic; margin-top: 3px; white-space: pre-wrap; }
details summary { cursor: pointer; font-family: "Oswald"; font-size: 15px; }
.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.style { cursor: pointer; }
.style .sw { height: 110px; border-radius: 10px; background: var(--ink) center/cover no-repeat; margin-bottom: 12px; display: grid; place-items: center; color: var(--yellow); font-family: "Anton"; font-size: 26px; }
.star { color: #b99a00; font-weight: 700; font-size: 13px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14px; z-index: 50; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.toast.err { background: var(--red); }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 40; cursor: zoom-out; padding: 20px; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.notice { background: var(--yellow-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.notice.red { background: var(--red-soft); }
ol.help li { margin-bottom: 10px; line-height: 1.5; }
@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; } .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .brand { margin: 0 12px 0 0; } .side .foot { display: none; } .nav { display: flex; gap: 4px; flex-wrap: wrap; }
  main { padding: 20px 16px 50px; } .grid2, .player, .cols2 { grid-template-columns: 1fr; }
  .banner { grid-template-columns: 1fr; } .steps { flex-wrap: wrap; } .steps div { flex: 1 1 45%; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="/web/logo.png" alt=""><div><b>ESTUDIO<br>DE REELS</b><small>Sundesign Muebles</small></div></div>
    <nav class="nav">
      <a href="#/" data-nav="trabajos">🎬 Videos <span class="count" id="navCount" hidden></span></a>
      <a href="#/sugerencias" data-nav="sugerencias">🧠 Sugerencias <span class="count" id="navSug" hidden></span></a>
      <a href="#/productos" data-nav="productos">📦 Productos</a>
      <a href="#/estilos" data-nav="estilos">🎨 Estilos</a>
      <a href="#/musica" data-nav="musica">🎵 Música</a>
      <a href="#/ayuda" data-nav="ayuda">❓ Ayuda</a>
    </nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main id="view"></main>
</div>

<script>
// ------------------------------------------------------------------ utilidades
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const file = r => "/archivo/" + r.split("/").map(encodeURIComponent).join("/");
let S = { inicio: null, job: null, jobKey: "", tab: "activos", ver: null };

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts,
    body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Algo salió mal");
  return j;
}
function toast(msg, err = false) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copiado ✓"); }
  catch { prompt("Copiá este texto:", text); }
}
function lightbox(src) {
  const d = document.createElement("div"); d.className = "lightbox";
  d.innerHTML = `<img src="${src}">`; d.onclick = () => d.remove(); document.body.appendChild(d);
}
function size(b) { return b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : b > 1e6 ? (b / 1e6).toFixed(0) + " MB" : Math.max(1, b / 1e3 | 0) + " KB"; }
function md(src) {   // markdown simple: títulos, negrita, código, listas, tablas
  const lines = esc(src).split("\n"); let out = "", inList = false, inTable = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>").replace(/_(.+?)_/g, "<i>$1</i>");
  for (const l of lines) {
    if (/^\s*\|/.test(l)) {
      if (/^\s*\|[\s|:-]+\|\s*$/.test(l)) continue;
      if (!inTable) { out += "<table>"; inTable = true; }
      out += "<tr>" + l.trim().replace(/^\||\|$/g, "").split("|").map(c => `<td>${inline(c.trim())}</td>`).join("") + "</tr>"; continue;
    } else if (inTable) { out += "</table>"; inTable = false; }
    if (/^\s*[-*] /.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`; continue; }
    else if (inList) { out += "</ul>"; inList = false; }
    const h = l.match(/^(#{1,3}) (.*)/);
    if (h) out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (l.startsWith("&lt;!--")) continue;
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  return out + (inList ? "</ul>" : "") + (inTable ? "</table>" : "");
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// subida con progreso (el archivo va directo, sin pasar por la memoria)
function upload(destino, f, onProgress) {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/api/subir?destino=${encodeURIComponent(destino)}&nombre=${encodeURIComponent(f.name)}`);
    x.upload.onprogress = e => e.lengthComputable && onProgress && onProgress(e.loaded / e.total);
    x.onload = () => x.status < 300 ? ok(JSON.parse(x.responseText)) : bad(new Error(JSON.parse(x.responseText || "{}").error || "Error al subir"));
    x.onerror = () => bad(new Error("Se cortó la subida"));
    x.send(f);
  });
}
// miniatura 9:16 desde un video o foto, generada en el navegador
function makeThumb(f) {
  return new Promise(res => {
    const url = URL.createObjectURL(f), c = document.createElement("canvas"); c.width = 270; c.height = 480;
    const draw = (el, w, h) => {
      const g = c.getContext("2d"), s = Math.max(270 / w, 480 / h);
      g.drawImage(el, (270 - w * s) / 2, (480 - h * s) / 2, w * s, h * s);
      c.toBlob(b => { URL.revokeObjectURL(url); res(b); }, "image/jpeg", .82);
    };
    if (f.type.startsWith("image/")) { const i = new Image(); i.onload = () => draw(i, i.width, i.height); i.onerror = () => res(null); i.src = url; return; }
    const v = document.createElement("video"); v.muted = true; v.preload = "metadata"; v.src = url;
    v.onloadeddata = () => { v.currentTime = Math.min(1, (v.duration || 2) / 3); };
    v.onseeked = () => draw(v, v.videoWidth, v.videoHeight);
    v.onerror = () => res(null);
  });
}
function dropzone(el, accept, onFiles) {
  const inp = document.createElement("input"); inp.type = "file"; inp.multiple = true; inp.accept = accept; inp.hidden = true;
  el.appendChild(inp);
  el.onclick = e => { if (e.target === inp) return; inp.click(); };
  inp.onchange = () => { onFiles([...inp.files]); inp.value = ""; };
  el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
  el.ondragleave = () => el.classList.remove("over");
  el.ondrop = e => { e.preventDefault(); el.classList.remove("over"); onFiles([...e.dataTransfer.files]); };
}
async function uploadMany(destino, files, listEl, after) {
  for (const f of files) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="n">⬆️ ${esc(f.name)} <span class="muted small">${size(f.size)}</span></span><span class="bar"><i></i></span>`;
    listEl.prepend(li);
    try {
      await upload(destino, f, p => li.querySelector(".bar i").style.width = (p * 100).toFixed(0) + "%");
      if (after) await after(f);
    } catch (e) { toast(e.message, true); }
    li.remove();
  }
}

// Copia el mensaje, intenta abrir la app de Claude y muestra los 3 pasos en grande
async function avisarClaude(titulo = "Avisale a Claude") {
  let copiado = true;
  try { await navigator.clipboard.writeText(S.inicio.cowork); } catch { copiado = false; }
  let abierto = false;
  try { abierto = (await api("/api/abrir-claude", { method: "POST", body: {} })).abierto; } catch { }
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box">
    <h2>${esc(titulo)}</h2><p class="muted" style="margin:0 0 10px">Claude trabaja en otra ventana. Hay que avisarle que tiene algo para hacer:</p>
    <div class="paso ${copiado ? "ok" : ""}"><div class="num">${copiado ? "✓" : "1"}</div><div><b>${copiado ? "Mensaje copiado" : "Copiá el mensaje"}</b>
      <p>${copiado ? "Ya está guardado, no tenés que escribir nada." : `<button class="btn" id="mcopy">📋 Copiar</button>`}</p></div></div>
    <div class="paso"><div class="num">2</div><div><b>Andá a Claude</b>
      <p>${abierto ? "Ya se está abriendo. " : ""}Es el ícono <span class="orange"></span> naranja de la barra de abajo. Entrá a <b>Cowork</b> y abrí la conversación de siempre: <b>“Reels Sundesign”</b>.</p></div></div>
    <div class="paso"><div class="num">3</div><div><b>Pegá y enviá</b>
      <p>Hacé clic en el cuadro de escribir y apretá <kbd>Ctrl</kbd> + <kbd>V</kbd>, después <kbd>Enter</kbd>.<br>Listo: volvé acá, esta pantalla se actualiza sola cuando Claude termine.</p></div></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn pri big" id="mok">Entendido</button></div></div>`;
  document.body.appendChild(m);
  m.onclick = e => { if (e.target === m) m.remove(); };
  $("#mok", m).onclick = () => m.remove();
  const mc = $("#mcopy", m); if (mc) mc.onclick = () => copy(S.inicio.cowork);
}

    || `<li class="muted small" style="border:0">Todavía no hay material cargado.</li>`;

          <div class="choice main"><h3>✨ Crear desde cero con Claude</h3><p>Claude propone ideas virales, escribe el guion y arma el plan de rodaje con dibujos para los que filman. <b>Recomendado.</b></p>
            <textarea id="ideaTxt" rows="2" placeholder="¿Ya tenés una idea? Escribila acá (opcional). Si no, Claude te propone 5."></textarea>
            <button class="btn pri big" id="pedirIdeas" style="margin-top:10px">💡 Pedir ideas a Claude</button></div>
          <div class="choice"><h3>🎞️ Ya tengo el material filmado</h3><p>Cargá los videos que ya tenés y Claude los edita.</p>
            <button class="btn big" id="tengoMaterial">Cargar videos</button></div>
        </div>`;
    case "bloqueado":
      return `<h2>Claude necesita una respuesta</h2><div class="notice">${esc(j.estado_json.mensaje || "")}</div>
        <div class="field" style="margin-top:12px"><textarea id="resp" placeholder="Tu respuesta…"></textarea></div>
        <button class="btn pri" id="responder">Responder y volver a enviar</button>`;
    case "ideas_listas": return ideasHTML(j);
    case "guion_listo": return guionHTML(j);
    case "plan_listo": return planHTML(j);
    case "rodaje": return rodajeHTML(j);
    case "control_listo": return controlHTML(j);
    case "ideas_pendiente": case "guion_pendiente": case "plan_pendiente": case "control_pendiente":
    case "pendiente": case "cambios_storyboard": case "aprobado": case "editando": case "correccion":
      return j.estado === "editando"
        ? `<h2>⏳ Claude está editando</h2><p>Ya está trabajando. No tenés que hacer nada: esta pantalla se actualiza sola cuando termine.</p>`
        : `<h2>${esc(j.estado_txt)}</h2><p>Ahora le toca a Claude. Si todavía no le avisaste, tocá el botón:</p>
        <div class="row"><button class="btn pri huge" onclick="avisarClaude()">📨 Avisar a Claude</button>
        <button class="btn ghost" id="cancelar">Volver a borrador</button></div>
        <p class="small muted" style="margin-top:10px">Esta pantalla se actualiza sola cuando Claude termine.</p>
        ${vids.length ? `<details style="margin-top:14px"><summary>Ver última versión mientras tanto</summary>${playerHTML(j)}</details>` : ""}`;
    case "storyboard_listo":
      return `<h2>Storyboard para aprobar</h2><p class="small muted">Así va a quedar el video, momento a momento. Tocá la imagen para verla grande.</p>
        <div class="sb stack">${sb.map(s => `<img src="${file(s.ruta)}?${s.fecha}" onclick="lightbox(this.src)">`).join("")}
        ${j.imagenes.filter(i => i.nombre.includes("antes_despues")).map(s => `<img src="${file(s.ruta)}?${s.fecha}" onclick="lightbox(this.src)">`).join("")}</div>
        ${T["guion_propuesto.md"] ? `<details style="margin-top:12px"><summary>Guion propuesto por Claude</summary><div class="md">${md(T["guion_propuesto.md"])}</div></details>` : ""}
        <div class="row" style="margin-top:14px"><button class="btn ok big" id="aprobar">✓ Aprobar y editar</button></div>
        <div class="field" style="margin-top:14px"><label class="f">¿Querés cambiar algo?</label><textarea id="cambiosTxt" placeholder="Ej: el título del principio más corto; en el plano 3 usá la toma de la tela."></textarea></div>
        <button class="btn" id="cambios">Pedir cambios</button>`;
    case "listo": case "publicado": case "archivado":
      return `<h2>${j.estado === "listo" ? "Video listo para revisar" : esc(j.estado_txt)}</h2>${playerHTML(j)}`;
  }
  return "";
}

function ideasHTML(j) {
  const ideas = j.pre.ideas || [];
  return `<h2>💡 Elegí la idea para este video</h2><p class="small muted">Claude propone ideas pensadas para que el video se vea, se guarde y se comparta. La ⭐ es su recomendada.</p>
    <div class="ideas">${ideas.map((x, k) => `<div class="idea ${x.recomendada ? "rec" : ""}">
      <div class="row" style="gap:6px">${x.recomendada ? '<span class="badge">⭐ Recomendada</span>' : ""}<span class="badge g">${esc(x.formato || "")}</span>${x.formula ? `<span class="badge g">📐 ${esc(x.formula)}</span>` : ""}${x.duracion ? `<span class="badge g">${esc(x.duracion)} s</span>` : ""}</div>
      <h3>${esc(x.titulo)}</h3>
      <div><div class="k">El gancho</div><div class="v">${esc(x.gancho)}</div></div>
      <div><div class="k">Por qué funciona</div><div class="v">${esc(x.por_que_funciona)}</div></div>
      ${x.necesita ? `<div><div class="k">Para filmarla hace falta</div><div class="v">${esc(x.necesita)}</div></div>` : ""}
      ${x.dificultad_rodaje ? `<div class="small muted">Dificultad de rodaje: ${esc(x.dificultad_rodaje)}</div>` : ""}
      <button class="btn pri" data-idea="${k}">Elegir esta idea</button></div>`).join("")}</div>
    <div class="cols2" style="margin-top:18px">
      <div><label class="f">¿Ninguna te convence?</label><textarea id="otrasTxt" rows="2" placeholder="Ej: quiero algo más divertido, con gente real, sobre las sillas."></textarea>
        <button class="btn" id="otras" style="margin-top:8px">🔄 Pedir otras ideas</button></div>
      <div><label class="f">¿Tenés tu propia idea?</label><textarea id="propiaTxt" rows="2" placeholder="Contala con tus palabras y Claude la convierte en guion."></textarea>
        <button class="btn" id="propia" style="margin-top:8px">✍️ Usar mi idea</button></div>
    </div>`;
}
function guionHTML(j) {
  return `<h2>✍️ Guion para aprobar</h2><p class="small muted">Leelo como si fueras quien mira el video. Si algo no te suena natural, pedí cambios.</p>
    <div class="card md" style="box-shadow:none;max-height:620px;overflow:auto">${j.pre.guion ? md(j.pre.guion) : '<p class="muted">No se encontró el guion.</p>'}</div>
    <div class="row" style="margin-top:14px"><button class="btn ok big" id="aprobarGuion">✓ Aprobar guion</button></div>
    <div class="field" style="margin-top:14px"><label class="f">¿Querés cambiar algo?</label><textarea id="guionTxt" placeholder="Ej: usá el gancho 2; la frase del final es muy larga; que aparezca el precio."></textarea></div>
    <button class="btn" id="cambiosGuion">Pedir cambios al guion</button>`;
}
function planHTML(j) {
  const h = j.pre.plan_html;
  return `<h2>🎥 Plan de rodaje para aprobar</h2><p class="small muted">Esto es lo que va a recibir la gente que filma: cada toma con su dibujo, qué hacer y qué decir.</p>
    ${h ? `<iframe class="plan-frame" src="${file(h)}?${j.actualizado}"></iframe>
      <div class="row" style="margin-top:10px"><a class="btn" href="${file(h)}" target="_blank">🖨 Abrir para imprimir o guardar en PDF</a></div>` : '<p class="muted">No se encontró el plan.</p>'}
    <div class="row" style="margin-top:14px"><button class="btn ok big" id="aprobarPlan">✓ Aprobar: ¡a filmar!</button></div>
    <div class="field" style="margin-top:14px"><label class="f">¿Querés cambiar algo?</label><textarea id="planTxt" placeholder="Ej: la toma 3 no se puede filmar así; no tenemos 8 sillas, solo 6."></textarea></div>
    <button class="btn" id="cambiosPlan">Pedir cambios al plan</button>`;
}
function rodajeHTML(j) {
  const tomas = (j.pre.plan.tomas || []), car = j.tomas_cargadas || {}, h = j.pre.plan_html;
  const faltan = tomas.filter(t => !car[String(t.n)]).length;
  return `<h2>📱 A filmar</h2><p class="small muted">Filmen siguiendo el plan y suban cada video en el casillero de <b>su toma</b>. Pueden subir varias versiones de la misma toma.</p>
    ${h ? `<a class="btn" href="${file(h)}" target="_blank">🖨 Ver / imprimir el plan de rodaje</a>` : ""}
    <ul class="shots">${tomas.map(t => { const f = car[String(t.n)] || [];
      return `<li class="${f.length ? "done" : ""}"><div class="num">${f.length ? "✓" : esc(t.n)}</div>
        <div class="d"><b>Toma ${esc(t.n)} · ${esc(t.momento || "")}</b> <span class="muted small">· ${esc(t.duracion || "")} s</span><br>${esc(t.que_se_ve || "")}${t.dice ? `<br><i>Dice: «${esc(t.dice)}»</i>` : ""}
        ${f.length ? `<div class="small" style="margin-top:4px;color:var(--green)">✓ ${f.length} video${f.length > 1 ? "s" : ""} cargado${f.length > 1 ? "s" : ""}: ${f.map(x => esc(x.nombre)).join(", ")}</div>` : ""}
        <div class="bar" style="margin-top:6px;display:none" id="bar${esc(t.n)}"><i></i></div></div>
        <button class="btn ${f.length ? "ghost" : "pri"}" data-toma="${esc(t.n)}">${f.length ? "＋ Otra versión" : "⬆ Subir video"}</button></li>`; }).join("")}</ul>
    <p class="small muted" style="margin-top:10px">¿Filmaron algo extra que sirve (tomas de recurso, ambiente)? Subilo abajo en «Material».</p>
    <div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
      <button class="btn ok big" id="materialListo" ${Object.keys(car).length || j.brutos.length ? "" : "disabled"}>✅ Terminamos de filmar</button>
      <span class="small ${faltan ? "" : "muted"}" style="${faltan ? "color:var(--red)" : ""}">${faltan ? `Faltan ${faltan} toma${faltan > 1 ? "s" : ""}.` : "Están todas las tomas."} Claude va a revisar que todo sirva antes de editar.</span></div>`;
}
function controlHTML(j) {
  return `<h2>🔍 Control del material</h2><p class="small muted">Claude revisó lo filmado contra el plan. Si alguna toma hay que repetirla, lo dice acá.</p>
    <div class="card md" style="box-shadow:none;max-height:560px;overflow:auto">${j.pre.control ? md(j.pre.control) : '<p class="muted">No se encontró el informe.</p>'}</div>
    <div class="row" style="margin-top:14px"><button class="btn ok big" id="controlOk">✓ Está bien: ¡a editar!</button>
      <button class="btn" id="refilmar">🎥 Volver a filmar algunas tomas</button></div>
    <div class="field" style="margin-top:12px"><label class="f">Comentario (opcional)</label><textarea id="controlTxt" rows="2" placeholder="Ej: la toma 3 la volvemos a filmar el lunes."></textarea></div>`;
}

function playerHTML(j) {
  const vids = j.videos; if (!vids.length) return `<p class="muted">Todavía no hay videos.</p>`;
  const v = vids.find(x => x.nombre === S.ver) || vids[vids.length - 1];
  const rev = Object.entries(j.textos).filter(([k]) => k.endsWith("_revision.md")).find(([k]) => k.startsWith(v.nombre.replace(/\.mp4$/, "")));
  const T = j.textos;
  return `<div class="player" style="margin-top:8px"><div><video id="vid" controls playsinline src="${file(v.ruta)}?${v.fecha}"></video>
      <div class="vers" style="margin-top:10px">${vids.map(x => `<button data-ver="${esc(x.nombre)}" class="${x === v ? "on" : ""}">${x.nombre.match(/_v(\d+)\.mp4$/)[0].slice(1, -4).toUpperCase()}</button>`).join("")}</div></div>
    <div class="stack">
      <div class="row"><a class="btn pri" href="${file(v.ruta)}?descargar=1">⬇ Descargar ${esc(v.nombre.match(/_v\d+/)[0].slice(1).toUpperCase())}</a>
        <button class="btn ghost" onclick="api('/api/abrir-carpeta',{method:'POST',body:{trabajo:'${j.id}',salida:1}})">📂 Carpeta</button></div>
      ${T["caption.md"] ? `<div><h3>Texto para la publicación</h3><div class="caption" id="cap">${esc(T["caption.md"])}</div>
        <button class="btn" style="margin-top:8px" onclick="copy($('#cap').textContent)">📋 Copiar texto</button></div>` : ""}
      ${T["resumen.md"] ? `<details open><summary>Qué hizo Claude</summary><div class="md">${md(T["resumen.md"])}</div></details>` : ""}
      ${rev ? `<details><summary>Revisión automática</summary><div class="md">${md(rev[1])}</div></details>` : ""}
      ${j.estado === "listo" ? `<div><h3>¿Hay que corregir algo?</h3>
        <textarea id="corr" placeholder="Pausá el video donde está el problema, tocá «Marcar este segundo» y escribí qué cambiar."></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" id="marcar">⏱ Marcar este segundo</button><button class="btn dark" id="corregir">Pedir corrección (nueva versión)</button></div>
        <div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px"><button class="btn ok" id="publicado">✓ Ya lo publiqué</button><button class="btn ghost" id="archivar">Archivar</button></div></div>`
      : `<div class="row"><button class="btn ghost" id="reabrir">Reabrir</button></div>`}
    </div></div>`;
}

function bindAction(j) {
  const act = (accion, extra = {}) => api(`/api/trabajo/${j.id}/accion`, { method: "POST", body: { accion, ...extra } })
    .then(() => refreshJob(true)).catch(e => toast(e.message, true));
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  const thenNotify = t => () => avisarClaude(t);
  on("#enviar", () => act("enviar").then(thenNotify("¡Enviado! Ahora avisale a Claude")));
  on("#cancelar", () => confirm("¿Volver a borrador? Claude no va a procesar este video hasta que lo envíes de nuevo.") && act("cancelar"));
  on("#aprobar", () => act("aprobar", { texto: ($("#cambiosTxt") || {}).value || "" }).then(thenNotify("¡Aprobado! Ahora avisale a Claude")));
  on("#cambios", () => $("#cambiosTxt").value.trim() ? act("cambios", { texto: $("#cambiosTxt").value }).then(thenNotify("Cambios pedidos. Avisale a Claude")) : toast("Escribí qué querés cambiar.", true));
  on("#responder", () => act("responder", { texto: $("#resp").value }).then(thenNotify("Respuesta enviada. Avisale a Claude")));
  on("#publicado", () => act("publicado"));
  on("#archivar", () => act("archivar"));
  on("#reabrir", () => act("reabrir"));
  // preproducción
  const savePedido = body => api(`/api/trabajo/${j.id}/pedido`, { method: "POST", body });
  on("#pedirIdeas", async () => {
    const idea = $("#ideaTxt").value.trim();
    await savePedido({ flujo: "completo" });
    if (idea) act("idea_propia", { texto: idea }).then(thenNotify("¡Listo! Avisale a Claude para que escriba el guion"));
    else act("pedir_ideas").then(thenNotify("¡Listo! Avisale a Claude para que proponga ideas"));
  });
  on("#tengoMaterial", async () => { await savePedido({ flujo: "material" }); refreshJob(true); });
  on("#irCompleto", async e => { e.preventDefault(); await savePedido({ flujo: "" }); refreshJob(true); });
  document.querySelectorAll("[data-idea]").forEach(b => b.onclick = () => {
    const idea = (j.pre.ideas || [])[+b.dataset.idea];
    act("elegir_idea", { idea, texto: idea.titulo }).then(thenNotify("¡Idea elegida! Avisale a Claude para que escriba el guion"));
  });
  on("#otras", () => act("otras_ideas", { texto: $("#otrasTxt").value }).then(thenNotify("Avisale a Claude para que proponga otras ideas")));
  on("#propia", () => act("idea_propia", { texto: $("#propiaTxt").value }).then(thenNotify("Avisale a Claude para que escriba el guion")));
  on("#aprobarGuion", () => act("aprobar_guion").then(thenNotify("¡Guion aprobado! Avisale a Claude para que arme el plan de rodaje")));
  on("#cambiosGuion", () => act("cambios_guion", { texto: $("#guionTxt").value }).then(thenNotify("Avisale a Claude para que corrija el guion")));
  on("#aprobarPlan", () => act("aprobar_plan").then(() => toast("¡A filmar! Compartí el plan con quienes filman.")));
  on("#cambiosPlan", () => act("cambios_plan", { texto: $("#planTxt").value }).then(thenNotify("Avisale a Claude para que corrija el plan")));
  on("#materialListo", () => {
    const faltan = (j.pre.plan.tomas || []).filter(t => !(j.tomas_cargadas || {})[String(t.n)]).length;
    if (faltan && !confirm(`Faltan ${faltan} toma(s). ¿Avisar igual que terminaron de filmar?`)) return;
    act("material_listo").then(thenNotify("¡Rodaje terminado! Avisale a Claude para que revise el material"));
  });
  on("#controlOk", () => act("control_ok", { texto: ($("#controlTxt") || {}).value || "" }).then(thenNotify("¡A editar! Avisale a Claude")));
  on("#refilmar", () => act("refilmar", { texto: ($("#controlTxt") || {}).value || "" }));
  document.querySelectorAll("[data-toma]").forEach(b => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "video/*,image/*"; inp.multiple = true; inp.hidden = true;
    b.after(inp); b.onclick = () => inp.click();
    inp.onchange = async () => {
      const n = b.dataset.toma, bar = $("#bar" + n); bar.style.display = "block"; b.disabled = true;
      for (const f of inp.files) {
        try {
          await upload(`trabajo/${j.id}/toma/${n}`, f, p => bar.querySelector("i").style.width = (p * 100).toFixed(0) + "%");
          if (!S.job.miniatura) { const bl = await makeThumb(f); if (bl) { await upload(`trabajo/${j.id}/miniatura`, new File([bl], "miniatura.jpg")); S.job.miniatura = 1; } }
        } catch (e) { toast(e.message, true); }
      }
      refreshJob(true);
    };
  });
  on("#marcar", () => {
    const t = $("#vid").currentTime, s = `[${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}] `;
    const c = $("#corr"); c.value = (c.value ? c.value.trimEnd() + "\n" : "") + s; c.focus();
  });
  on("#corregir", () => !$("#corr").value.trim() ? toast("Escribí qué querés corregir.", true) : act("correccion", { texto: $("#corr").value, version: (S.job.videos.find(x => x.nombre === S.ver) || S.job.videos.at(-1)).nombre }).then(thenNotify("Corrección pedida. Avisale a Claude")));
  document.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => { S.ver = b.dataset.ver; renderJobDynamic(); });
}

async function refreshJob(force = false) {
  if (!S.job) return;
  const busy = document.activeElement && ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName) && $("#action").contains(document.activeElement);
  const vid = $("#vid"); const playing = vid && !vid.paused;
  await loadInicio();
  const j = await api("/api/trabajo/" + S.job.id);
  const key = JSON.stringify(j);
  if (!force && (key === S.jobKey || busy || playing)) return;
  S.job = j; S.jobKey = key; renderJobDynamic();
}

// ------------------------------------------------------------------ navegación
async function route() {
  const h = location.hash.replace(/^#\/?/, "").split("/");
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === (h[0] === "trabajo" ? "trabajos" : h[0] || "trabajos")));
  S.job = h[0] === "trabajo" ? S.job : null; S.ver = null;
  try {
    if (h[0] === "trabajo") await views.trabajo(h[1]);
    else if (h[0] === "estilos") await views.estilos(h[1]);
    else if (h[0] === "productos") await views.productos(h[1]);
    else if (views[h[0]]) await views[h[0]]();
    else await views.trabajos();
  } catch (e) { $("#view").innerHTML = `<div class="card empty"><b>No se pudo abrir</b>${esc(e.message)}<br><br><a class="btn" href="#/">Volver</a></div>`; }
}
window.addEventListener("hashchange", route);
route();
// actualización automática (para ver cuando Claude termina)
setInterval(async () => {
  try {
    const h = location.hash;
    if (h.startsWith("#/trabajo/")) return refreshJob();
    if (h === "" || h === "#/" ) {
      const prev = JSON.stringify(S.inicio?.trabajos) + S.inicio?.pendientes;
      await loadInicio();
      if (JSON.stringify(S.inicio.trabajos) + S.inicio.pendientes !== prev) views.trabajos();
    } else if (h.startsWith("#/estilos")) {
      const prev = JSON.stringify(S.inicio?.estilos);
      await loadInicio();
      if (JSON.stringify(S.inicio.estilos) !== prev && !document.activeElement?.matches("textarea")) route();
    }
  } catch { /* la app puede estar cerrándose */ }
}, 4000);
</script>
</body>
</html>
